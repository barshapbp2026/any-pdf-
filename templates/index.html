<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amita:wght@400;700&family=Arya:wght@400;700&family=Baloo+2:wght@400;500;600;700&family=Eczar:wght@400;500;600;700&family=Hind:wght@400;500;600;700&family=Khand:wght@400;500;600;700&family=Martel:wght@400;600;700&family=Mukta:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Serif+Devanagari:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Yatra+One&display=swap" rel="stylesheet">
<title>नेपाली कानुनी PDF सहायक</title>
<style>
  *{box-sizing:border-box}
  body{font-family:'Mukta','Noto Sans Devanagari','Hind','Tiro Devanagari Hindi','Kalimati','Mangal','Noto Serif Devanagari','Martel','Khand','Eczar','Arya','Amita','Yatra One','Baloo 2',Arial,sans-serif;margin:0;background:#f5f7fa;color:#1f2937}
  header{background:linear-gradient(135deg,#1e3a8a,#3b82f6);color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
  header h1{margin:0;font-size:18px;font-weight:600}
  header input{font-family:Consolas, monospace !important;padding:9px 12px;border-radius:6px;border:none;width:250px;font-size:13px;color:#333}
  .container{max-width:1050px;margin:24px auto;padding:0 16px}
  .card{background:#fff;border-radius:10px;padding:20px;margin-bottom:18px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .card h2{margin:0 0 14px;font-size:16px;color:#1e3a8a;border-bottom:2px solid #e5e7eb;padding-bottom:8px}
  input[type=text],select{padding:9px 12px;border:1px solid #d1d5db;border-radius:6px;font-size:14px;font-family:inherit; width: 100%; margin-bottom: 8px;}
  button{padding:9px 18px;background:#1e3a8a;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:14px;font-weight:500;font-family:inherit}
  button:hover{background:#1e40af}
  button.small{padding:5px 12px;font-size:12px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .search-box{border:2px solid #e5e7eb;border-radius:8px;padding:14px;background:#f9fafb;}
  .search-box h3{margin:0 0 10px;font-size:14px;color:#374151}
  .result-item{border-left:4px solid #3b82f6;background:#f8fafc;padding:12px 14px;margin:10px 0;border-radius:6px}
  .result-item .meta{font-family:'Mukta','Noto Sans Devanagari','Hind','Kalimati','Mangal',sans-serif;font-size:13px;color:#6b7280;margin-bottom:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .result-item .meta strong{color:#1e3a8a}
  .result-item .snippet{font-family:'Mukta','Noto Sans Devanagari','Hind','Kalimati','Mangal','Noto Serif Devanagari',sans-serif;font-size:16px;line-height:1.95;color:#172033;font-weight:500;}
  .pdf-group{margin-bottom:16px}
  .pdf-group h4{font-family:'Mukta','Noto Sans Devanagari','Hind','Kalimati','Mangal',sans-serif;margin:0 0 8px;color:#374151;font-size:14px}
  .badge{display:inline-block;background:#dbeafe;color:#1e40af;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:600}
  .answer{background:#ecfdf5;border-left:4px solid #10b981;padding:14px;border-radius:6px;white-space:pre-wrap;line-height:1.7;font-size:14px}
  .empty{color:#9ca3af;font-style:italic;padding:20px;text-align:center}
  
  .nav-menu { display: flex; flex-wrap: wrap; background: #fff; padding: 0; margin: 0; border-bottom: 1px solid #ddd; }
  .nav-item { position: relative; cursor: pointer; padding: 12px 18px; font-weight: 500; color: #333; font-size: 15px; transition: 0.2s; border-right: 1px solid #f0f0f0; }
  .nav-item:hover { background: #145db5; color: #fff; }
  
  .dropdown { display: none; position: absolute; top: 100%; left: 0; background: #fff; min-width: max-content; box-shadow: 0 4px 15px rgba(0,0,0,0.15); border-radius: 0 0 4px 4px; z-index: 100; border: 1px solid #ccc; border-top: none; padding: 10px 0 0 0; margin-top: -5px; text-align: left;}
  .nav-item:hover > .dropdown { display: block; }
  
  .dropdown-item { position: relative; padding: 9px 20px 9px 15px; color: #333; font-size: 13px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; white-space: nowrap; border-bottom: 1px solid #eee; transition: 0.1s; text-decoration: none; }
  .dropdown-item:last-child { border-bottom: none; }
  .dropdown-item:hover { background: #145db5; color: #fff; }
  
  .sub-dropdown { display: none; position: absolute; top: 0; left: 100%; background: #fff; min-width: max-content; box-shadow: 0 4px 15px rgba(0,0,0,0.15); border-radius: 0 4px 4px 4px; border: 1px solid #ccc; padding: 5px 0; margin-left: -1px; }
  .dropdown-item:hover > .sub-dropdown { display: block; }
  
  .arrow { font-size: 10px; margin-left: 20px; color: #666; }
  .dropdown-item:hover .arrow { color: #fff; }

  .plus-btn { background: #10b981; color: white; border-radius: 6px; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; border: none; padding: 0; margin-bottom: 8px; flex-shrink: 0;}
  .plus-btn:hover { background: #059669; }
  .search-input-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: flex-start; }
  .search-input-row input { flex: 1; margin-bottom: 0; }
  .remove-btn { background: #ef4444; color: white; border: none; border-radius: 6px; height: 38px; padding: 0 12px; cursor: pointer; font-size: 14px; flex-shrink: 0;}

  .multi-select-box { max-height: 180px; overflow-y: auto; border: 1px solid #d1d5db; border-radius: 6px; padding: 8px; background: #fff; margin-bottom: 8px; }
  .multi-select-box label { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 6px 0; cursor: pointer; border-bottom: 1px solid #f3f4f6; }
  .multi-select-box label:last-child { border-bottom: none; }
  .multi-select-box input[type="checkbox"] { width: 16px; height: 16px; margin: 0; cursor: pointer; }
  .select-all-row { font-weight: bold; background: #e0f2fe; border-radius: 4px; padding: 8px !important; margin-bottom: 5px; border: none !important; color: #0369a1;}

  .search-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }

  @media(max-width:700px){.grid2{grid-template-columns:1fr}header input{width:150px}}
</style>
</head>
<body>

<header>
  <h1>📚 नेपाली कानुनी PDF सहायक</h1>
  <div style="display:flex; gap:10px; align-items:center;">
        <input type="text" id="apiKey" placeholder="Gemini API Key (सिधै Key मात्र हाल्नुहोस्)" style="margin-bottom:0;">
        <button onclick="checkApiKey()" style="padding:9px 15px; background:#10b981; white-space:nowrap;">Key जाँच</button>
        <span id="apiKeyStatus" style="font-weight:bold; font-size:14px; white-space:nowrap;"></span>
    </div>
</header>

<div class="container">
  <div class="card" style="padding:0; overflow:visible; border:1px solid #ddd;">
    <div id="navMenu" class="nav-menu">
      <div class="empty">लोड हुँदैछ...</div>
    </div>
  </div>

  <div class="card">
    <h2>🔍 खोज्नुहोस् (Search)</h2>
    <div class="grid2">
      
      <div class="search-box">
        <h3>📄 निश्चित PDF भित्र खोज</h3>
        <select id="searchFolderSelect" onchange="updatePdfSelect()">
          <option value="">— पहिले फोल्डर छान्नुहोस् —</option>
        </select>
        <select id="searchPdfSelect" onchange="toggleViewBtn()">
          <option value="">— PDF छान्नुहोस् —</option>
        </select>
        
        <div style="display:flex; gap:10px; margin-bottom:10px;">
            <button id="viewSelectedPdfBtn" style="flex:1; background:#059669; display:none;" onclick="viewSelectedPdf()">📖 यो PDF पढ्नुहोस्</button>
            <button id="downloadSelectedPdfBtn" style="flex:1; background:#dc2626; display:none;" onclick="downloadSelectedPdf()">⬇️ डाउनलोड</button>
        </div>

        <div class="search-grid">
            <input type="text" id="input-dhara" placeholder="धारा (जस्तै: १०)">
            <input type="text" id="input-dafa" placeholder="दफा (जस्तै: ५)">
            <input type="text" id="input-niyam" placeholder="नियम (जस्तै: ३)">
            <input type="text" id="input-nirdeshan" placeholder="निर्देशन">
            <input type="text" id="input-anusuchi" placeholder="अनुसूची">
            <input type="text" id="input-general" placeholder="हेडर भित्रको शब्द (जस्तै: टायल)">
        </div>

        <button onclick="doSearch('specific')" style="width:100%; margin-top:10px;">PDF भित्र खोज्नुहोस्</button>
      </div>

      <div class="search-box">
        <h3>📁 फोल्डर / शीर्षक भित्र खोज</h3>
        <div class="multi-select-box" id="folderCheckboxes"></div>
        <div id="folderSearchInputs">
          <div class="search-input-row">
            <input type="text" class="folder-query" placeholder="खोज्नको लागि शब्द लेख्नुहोस्...">
            <button class="plus-btn" onclick="addSearchInput('folderSearchInputs', 'folder-query')" title="अर्को थप्नुहोस्">+</button>
          </div>
        </div>
        <button onclick="doSearch('folder')" style="width:100%; margin-top:10px;">छानिएका फोल्डरमा खोज्नुहोस्</button>
      </div>

    </div>
  </div>

  <div class="card">
    <h2>💬 PDF सँग प्रश्न सोध्नुहोस्</h2>
    <div class="row" style="margin-bottom: 10px;">
      <select id="chatScope" onchange="updateChatScope()" style="flex:1;">
        <option value="all">🌐 सबै PDF हरूमा खोज्नुहोस्</option>
        <option value="folders">📁 निश्चित फोल्डरहरू भित्र खोज्नुहोस् (Multiple)</option>
        <option value="specific">📄 निश्चित PDF भित्र खोज्नुहोस्</option>
      </select>
    </div>

    <div id="chatFoldersContainer" style="display:none; margin-bottom:10px; border:1px solid #d1d5db; border-radius:6px; padding:8px; max-height:150px; overflow-y:auto; background:#fff;"></div>

    <div class="row" id="chatTargetRow" style="display:none; margin-bottom: 10px;">
        <select id="chatPdfSelect" style="flex:1;"></select>
    </div>

    <div class="row">
      <input type="text" id="chatQuery" placeholder="तपाईंको प्रश्न..." style="flex:1;min-width:220px; margin-bottom:0;">
      <button id="chatBtn">पठाउनुहोस्</button>
    </div>
  </div>

  <div class="card">
    <h2>📋 नतिजा</h2>
    <div id="answerWrap"></div>
    <div id="resultsWrap"></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const GITHUB_REPO = "barshapbp2026/any-pdf-";
const GITHUB_BRANCH = "main";



function cleanName(name) { return name.replace(/\.pdf$/i, ''); }

function getPdfViewerUrl(filepath) {
  const encodedPath = filepath.split('/').map(encodeURIComponent).join('/');
  const rawUrl = `https://raw.githubusercontent.com/${GITHUB_REPO}/${GITHUB_BRANCH}/pdfs/${encodedPath}`;
  return `https://docs.google.com/viewer?url=${encodeURIComponent(rawUrl)}&embedded=true`;
}

function getPdfPageViewerUrl(filepath, page, snippet) {
  const encodedPath = filepath.split('/').map(encodeURIComponent).join('/');
  const rawUrl = `https://raw.githubusercontent.com/${GITHUB_REPO}/${GITHUB_BRANCH}/pdfs/${encodedPath}`;
  const viewer = 'https://mozilla.github.io/pdf.js/web/viewer.html';
  const searchText = String(snippet || '').replace(/\\s+/g, ' ').trim().slice(0, 4500);
  // phrase=true makes PDF.js highlight the complete heading phrase, not each common word separately.
  const hash = `page=${Math.max(1, Number(page) || 1)}&zoom=page-fit&search=${encodeURIComponent(searchText)}&phrase=true`;
  return `${viewer}?file=${encodeURIComponent(rawUrl)}#${hash}`;
}

function getDownloadUrl(filepath) {
  const encodedPath = filepath.split('/').map(encodeURIComponent).join('/');
  return `https://raw.githubusercontent.com/${GITHUB_REPO}/${GITHUB_BRANCH}/pdfs/${encodedPath}`;
}

window.openPdfFromHeader = function(filepath) {
  window.open(getPdfViewerUrl(filepath), '_blank');
}

function buildTree(paths) {
  const tree = {};
  paths.forEach(path => {
    const parts = path.split('/');
    let current = tree;
    for (let i = 0; i < parts.length - 1; i++) {
      const part = parts[i];
      if (!current[part]) current[part] = {};
      current = current[part];
    }
    const file = parts[parts.length - 1];
    current[file] = { _isFile: true, _path: path };
  });
  return tree;
}

function renderTree(tree, level = 0) {
  let html = '';
  let keys = Object.keys(tree).filter(k => k !== '_isFile' && k !== '_path');
  keys.sort((a, b) => a.localeCompare(b, 'ne', { numeric: true }));

  keys.forEach(key => {
    const node = tree[key];
    const hasChildren = Object.keys(node).filter(k => k !== '_isFile').length > 0;
    const isFile = node._isFile;
    const displayName = cleanName(key);

    if (level === 0) {
      html += `<div class="nav-item">${esc(displayName)}`;
      if (hasChildren) html += `<div class="dropdown">${renderTree(node, level + 1)}</div>`;
      html += `</div>`;
    } else {
      if (hasChildren) {
        html += `<div class="dropdown-item">${esc(displayName)} <span class="arrow">▶</span>`;
        html += `<div class="sub-dropdown">${renderTree(node, level + 1)}</div>`;
        html += `</div>`;
      } else if (isFile) {
        const safePath = node._path.replace(/'/g, "\\'");
        html += `<a href="javascript:void(0)" onclick="openPdfFromHeader('${safePath}')" class="dropdown-item">📄 ${esc(displayName)}</a>`;
      }
    }
  });
  return html;
}

let allFiles = [];
let allFolders = [];

async function loadPdfs() {
  const r = await fetch('/list_pdfs');
  allFiles = await r.json();
  
  if (!allFiles.length) {
    $('#navMenu').innerHTML = '<div class="empty" style="padding:10px;">कुनै PDF भेटिएन।</div>';
    return;
  }
  
  const tree = buildTree(allFiles);
  $('#navMenu').innerHTML = renderTree(tree, 0);

  let folderSet = new Set();
  allFiles.forEach(f => {
    let parts = f.split('/');
    if (parts.length > 1) {
      folderSet.add(parts[0]); 
      if (parts.length > 2) folderSet.add(parts[0] + '/' + parts[1]); 
    }
  });
  
  allFolders = Array.from(folderSet).sort((a, b) => a.localeCompare(b, 'ne', { numeric: true }));
  
  let folderSelectHtml = '<option value="">— पहिले फोल्डर छान्नुहोस् —</option>';
  allFolders.forEach(f => folderSelectHtml += `<option value="${esc(f)}">📁 ${esc(f)}</option>`);
  $('#searchFolderSelect').innerHTML = folderSelectHtml;

  let checkboxHtml = `<label class="select-all-row"><input type="checkbox" id="selectAllFolders" onchange="toggleAllFolders(this)"> ☑️ सबै छान्नुहोस् (Select All)</label>`;
  allFolders.forEach(f => checkboxHtml += `<label><input type="checkbox" class="folder-checkbox" value="${esc(f)}"> 📁 ${esc(f)}</label>`);
  $('#folderCheckboxes').innerHTML = checkboxHtml;

  let chatCheckboxHtml = '';
  allFolders.forEach(f => {
    chatCheckboxHtml += `<label style="display:flex; align-items:center; gap:8px; font-size:13px; padding:4px 0; cursor:pointer; border-bottom:1px solid #f3f4f6;">
        <input type="checkbox" class="chat-folder-checkbox" value="${esc(f)}"> 📁 ${esc(f)}
    </label>`;
  });
  $('#chatFoldersContainer').innerHTML = chatCheckboxHtml;
}

function updateChatScope() {
    const scope = $('#chatScope').value;
    $('#chatTargetRow').style.display = 'none';
    $('#chatFoldersContainer').style.display = 'none';
    
    if (scope === 'folders') {
        $('#chatFoldersContainer').style.display = 'block';
    } else if (scope === 'specific') {
        $('#chatTargetRow').style.display = 'flex';
        $('#chatPdfSelect').style.display = 'block';
        updateChatPdfSelect();
    }
}

function updateChatPdfSelect() {
    const pdfSelect = $('#chatPdfSelect');
    let html = '<option value="">— PDF छान्नुहोस् —</option>';
    allFiles.forEach(f => html += `<option value="${esc(f)}">📄 ${esc(cleanName(f))}</option>`);
    pdfSelect.innerHTML = html;
}

function updatePdfSelect() {
  const selectedFolder = $('#searchFolderSelect').value;
  const pdfSelect = $('#searchPdfSelect');
  if (!selectedFolder) { pdfSelect.innerHTML = '<option value="">— PDF छान्नुहोस् —</option>'; toggleViewBtn(); return; }
  const filesInFolder = allFiles.filter(f => f.startsWith(selectedFolder + '/'));
  let html = '<option value="">— PDF छान्नुहोस् —</option>';
  filesInFolder.forEach(f => html += `<option value="${esc(f)}">📄 ${esc(cleanName(f))}</option>`);
  pdfSelect.innerHTML = html;
  toggleViewBtn();
}

function toggleViewBtn() {
  const val = $('#searchPdfSelect').value;
  if (val) {
    $('#viewSelectedPdfBtn').style.display = 'block';
    $('#downloadSelectedPdfBtn').style.display = 'block';
  } else {
    $('#viewSelectedPdfBtn').style.display = 'none';
    $('#downloadSelectedPdfBtn').style.display = 'none';
  }
}

function viewSelectedPdf() {
  const val = $('#searchPdfSelect').value;
  if (val) window.open(getPdfViewerUrl(val), '_blank');
}

function downloadSelectedPdf() {
  const val = $('#searchPdfSelect').value;
  if (val) window.open(getDownloadUrl(val), '_blank');
}

function toggleAllFolders(source) {
  document.querySelectorAll('.folder-checkbox').forEach(cb => cb.checked = source.checked);
}

function addSearchInput(containerId, inputClass) {
  const container = $('#' + containerId);
  if (container.children.length >= 6) return alert('अधिकतम ६ वटा मात्र थप्न सकिन्छ।');
  const div = document.createElement('div');
  div.className = 'search-input-row';
  div.innerHTML = `<input type="text" class="${inputClass}" placeholder="अर्को शब्द..."><button class="remove-btn" onclick="this.parentElement.remove()">✖</button>`;
  container.appendChild(div);
}

async function checkApiKey() {
    const key = document.getElementById('apiKey').value.trim();
    const statusSpan = document.getElementById('apiKeyStatus');
    if (!key) { statusSpan.innerText = "❌ Key खाली छ"; statusSpan.style.color = "#ef4444"; return; }
    statusSpan.innerText = "⏳ जाँच हुँदै..."; statusSpan.style.color = "#f59e0b";
    try {
        const r = await fetch('/check_api_key', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({api_key: key})
        });
        const d = await r.json();
        if (d.valid) { statusSpan.innerText = "✅ Valid"; statusSpan.style.color = "#10b981"; }
        else { statusSpan.innerText = "❌ Invalid: " + (d.error || "अज्ञात कारण"); statusSpan.style.color = "#ef4444"; }
    } catch (e) {
        statusSpan.innerText = "❌ नेटवर्क एरर"; statusSpan.style.color = "#ef4444";
    }
}

function normalizeNumberOnSearch(value) {
  const raw = String(value || '').trim();
  // Only convert a number of 1–3 digits when Search is pressed.
  // Free typing is untouched; 23 -> २३. and 111 -> १११.
  if (!/^[0-9०-९]{1,3}\\.?$/.test(raw)) return raw;
  const digits = raw.replace(/\\.$/, '').replace(/[0-9]/g, d => '०१२३४५६७८९'[Number(d)]);
  return digits + '.';
}

async function doSearch(type) {
  let payload = { mode: type };
  
  if (type === 'specific') {
    const dhara = normalizeNumberOnSearch($('#input-dhara').value);
    $('#input-dhara').value = dhara;
    const dafa = normalizeNumberOnSearch($('#input-dafa').value);
    $('#input-dafa').value = dafa;
    const niyam = normalizeNumberOnSearch($('#input-niyam').value);
    $('#input-niyam').value = niyam;
    const nirdeshan = normalizeNumberOnSearch($('#input-nirdeshan').value);
    $('#input-nirdeshan').value = nirdeshan;
    const anusuchi = normalizeNumberOnSearch($('#input-anusuchi').value);
    $('#input-anusuchi').value = anusuchi;
    const general = $('#input-general').value.trim();
    
    if (!dhara && !dafa && !niyam && !nirdeshan && !anusuchi && !general) {
        return alert('कृपया कुनै एउटा बक्समा खोज्ने शब्द वा नम्बर लेख्नुहोस्');
    }
    payload.dhara = dhara; payload.dafa = dafa; payload.niyam = niyam;
    payload.nirdeshan = nirdeshan; payload.anusuchi = anusuchi; payload.general = general;
    payload.target = $('#searchPdfSelect').value;
    if (!payload.target) return alert('कृपया सूचीबाट एउटा PDF छान्नुहोस्');
    
  } else {
    const queries = Array.from(document.querySelectorAll('.folder-query')).map(i => i.value.trim()).filter(v => v);
    const targets = Array.from(document.querySelectorAll('.folder-checkbox:checked')).map(cb => cb.value);
    if (!queries.length) return alert('खोज्नको लागि कम्तिमा एउटा शब्द लेख्नुहोस्');
    payload.queries = queries;
    payload.targets = targets;
    if (targets.length === 0) payload.mode = 'all';
  }
  
  $('#resultsWrap').innerHTML = '<div class="empty">खोजिँदै...</div>';
  const r = await fetch('/search', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(payload)
  });
  const d = await r.json();
  if (d.error) return alert(d.error);
  
  let queryDisplay = "";
  if (type === 'specific') {
      const parts = [];
      if (payload.dhara) parts.push(`धारा ${payload.dhara}`);
      if (payload.dafa) parts.push(`दफा ${payload.dafa}`);
      if (payload.niyam) parts.push(`नियम ${payload.niyam}`);
      if (payload.nirdeshan) parts.push(`निर्देशन ${payload.nirdeshan}`);
      if (payload.anusuchi) parts.push(`अनुसूची ${payload.anusuchi}`);
      if (payload.general) parts.push(payload.general);
      queryDisplay = parts.join(' / ');
  } else {
      queryDisplay = payload.queries.join(' + ');
  }
  
  renderResults(d.results, queryDisplay);
}

function renderResults(results, query) {
  const wrap = $('#resultsWrap');
  if (!results || !results.length) { 
      wrap.innerHTML = `<div class="empty">"${esc(query)}" का लागि कुनै नतिजा भेटिएन।</div>`; return; 
  }
  let html = '';
  results.forEach(g => {
    html += `<div class="pdf-group"><h4>📄 ${esc(g.filename)}</h4>`;
    g.matches.forEach(m => {
      const sec = m.section ? `<span class="badge">${esc(m.section)}</span>` : `<span class="badge">सन्दर्भ अज्ञात</span>`;
      const pageUrl = getPdfPageViewerUrl(g.filename, m.page, m.highlight_text || m.snippet);
      html += `<div class="result-item"><div class="meta">${sec} पृष्ठ <strong>${m.page}</strong><a href="${pageUrl}" target="_blank" rel="noopener" style="margin-left:auto"><button class="small">पृष्ठ हाइलाइटसहित देखाउनुहोस् →</button></a></div><div class="snippet">${esc(m.snippet)}</div></div>`;
    });
    html += '</div>';
  });
  wrap.innerHTML = html;
}

$('#chatBtn').onclick = async () => {
  const query = $('#chatQuery').value.trim();
  if (!query) return alert('प्रश्न लेख्नुहोस्');
  
  const api_key = $('#apiKey').value.trim();
  const mode = $('#chatScope').value;
  let target = ""; let targets = [];
  
  if (mode === 'folders') {
      targets = Array.from(document.querySelectorAll('.chat-folder-checkbox:checked')).map(cb => cb.value);
      if (targets.length === 0) return alert('कृपया कम्तिमा एउटा फोल्डर छान्नुहोस्');
  } else if (mode === 'specific') {
      target = $('#chatPdfSelect').value;
      if (!target) return alert('कृपया PDF छान्नुहोस्');
  }

  $('#answerWrap').innerHTML = '<div class="answer">प्रश्न प्रशोधन हुँदैछ...</div>';
  
  const r = await fetch('/chat', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ queries: [query], api_key, mode, target, targets })
  });
  const d = await r.json();
  $('#answerWrap').innerHTML = `<div class="answer">${esc(d.answer)}</div>`;
  renderResults(d.results, query);
};

loadPdfs();
</script>
</body>
</html>
