<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>नेपाली कानुनी PDF सहायक</title>
<style>
  *{box-sizing:border-box}
  body{font-family:'Kalimati','Mangal',Arial,sans-serif;margin:0;background:#f5f7fa;color:#1f2937}
  header{background:linear-gradient(135deg,#1e3a8a,#3b82f6);color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
  header h1{margin:0;font-size:18px;font-weight:600}
  header input{font-family:Consolas, monospace !important;padding:9px 12px;border-radius:6px;border:none;width:250px;font-size:13px;color:#333}
  .container{max-width:1050px;margin:24px auto;padding:0 16px}
  .card{background:#fff;border-radius:10px;padding:20px;margin-bottom:18px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .card h2{margin:0 0 14px;font-size:16px;color:#1e3a8a;border-bottom:2px solid #e5e7eb;padding-bottom:8px}
  input[type=text],select{padding:9px 12px;border:1px solid #d1d5db;border-radius:6px;font-size:14px;font-family:inherit; width: 100%; margin-bottom: 8px;}
  button{padding:9px 18px;background:#1e3a8a;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:14px;font-weight:500;font-family:inherit}
  button:hover{background:#1e40af}
  button.small{padding:5px 12px;font-size:12px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .search-box{border:2px solid #e5e7eb;border-radius:8px;padding:14px;background:#f9fafb;}
  .search-box h3{margin:0 0 10px;font-size:14px;color:#374151}
  .result-item{border-left:4px solid #3b82f6;background:#f8fafc;padding:12px 14px;margin:10px 0;border-radius:6px}
  .result-item .meta{font-size:12px;color:#6b7280;margin-bottom:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .result-item .meta strong{color:#1e3a8a}
  .result-item .snippet{font-size:14px;line-height:1.65;color:#374151}
  .pdf-group{margin-bottom:16px}
  .pdf-group h4{margin:0 0 8px;color:#374151;font-size:14px}
  .badge{display:inline-block;background:#dbeafe;color:#1e40af;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:600}
  .answer{background:#ecfdf5;border-left:4px solid #10b981;padding:14px;border-radius:6px;white-space:pre-wrap;line-height:1.7;font-size:14px}
  .empty{color:#9ca3af;font-style:italic;padding:20px;text-align:center}
  
  /* Dropdown CSS (Pure Hover for PC) */
  .nav-menu { display: flex; flex-wrap: wrap; background: #fff; padding: 0; margin: 0; border-bottom: 1px solid #ddd; }
  .nav-item { position: relative; cursor: pointer; padding: 12px 18px; font-weight: 500; color: #333; font-size: 15px; transition: 0.2s; border-right: 1px solid #f0f0f0; }
  .nav-item:hover { background: #145db5; color: #fff; }
  
  .dropdown { display: none; position: absolute; top: 100%; left: 0; background: #fff; min-width: max-content; box-shadow: 0 4px 15px rgba(0,0,0,0.15); border-radius: 0 0 4px 4px; z-index: 100; border: 1px solid #ccc; border-top: none; padding: 0; text-align: left;}
  
  /* Hover गर्दा खुल्ने */
  .nav-item:hover > .dropdown { display: block; }
  
  .dropdown-item { position: relative; padding: 9px 20px 9px 15px; color: #333; font-size: 13px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; white-space: nowrap; border-bottom: 1px solid #eee; transition: 0.1s; text-decoration: none; }
  .dropdown-item:last-child { border-bottom: none; }
  .dropdown-item:hover { background: #145db5; color: #fff; }
  
  .sub-dropdown { display: none; position: absolute; top: 0; left: 100%; background: #fff; min-width: max-content; box-shadow: 0 4px 15px rgba(0,0,0,0.15); border-radius: 0 4px 4px 4px; border: 1px solid #ccc; padding: 0; margin-left: -1px; }
  
  /* Hover गर्दा सब-मेनु खुल्ने */
  .dropdown-item:hover > .sub-dropdown { display: block; }
  
  .arrow { font-size: 10px; margin-left: 20px; color: #666; }
  .dropdown-item:hover .arrow { color: #fff; }

  /* Search inputs styles */
  .plus-btn { background: #10b981; color: white; border-radius: 6px; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; border: none; padding: 0; margin-bottom: 8px; flex-shrink: 0;}
  .plus-btn:hover { background: #059669; }
  .search-input-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: flex-start; }
  .search-input-row input { flex: 1; margin-bottom: 0; }
  .remove-btn { background: #ef4444; color: white; border: none; border-radius: 6px; height: 38px; padding: 0 12px; cursor: pointer; font-size: 14px; flex-shrink: 0;}

  .multi-select-box { max-height: 180px; overflow-y: auto; border: 1px solid #d1d5db; border-radius: 6px; padding: 8px; background: #fff; margin-bottom: 8px; }
  .multi-select-box label { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 6px 0; cursor: pointer; border-bottom: 1px solid #f3f4f6; }
  .multi-select-box label:last-child { border-bottom: none; }
  .multi-select-box input[type="checkbox"] { width: 16px; height: 16px; margin: 0; cursor: pointer; }
  .select-all-row { font-weight: bold; background: #e0f2fe; border-radius: 4px; padding: 8px !important; margin-bottom: 5px; border: none !important; color: #0369a1;}

  @media(max-width:700px){.grid2{grid-template-columns:1fr}header input{width:150px}}
</style>
</head>
<body>

<header>
  <h1>📚 नेपाली कानुनी PDF सहायक</h1>
  <input type="text" id="apiKey" placeholder="Gemini API Key (यहाँ देखिन्छ)">
</header>

<div class="container">
  <div class="card" style="padding:0; overflow:visible; border:1px solid #ddd;">
    <div id="navMenu" class="nav-menu">
      <div class="empty">लोड हुँदैछ...</div>
    </div>
  </div>

  <!-- PDF हेर्ने भाग (Hover Menu) -->
  <div class="card" style="padding:0; overflow:visible; border:1px solid #ddd;">
    <div class="nav-menu" style="background:#f8fafc;">
      <div class="nav-item" style="color:#1e3a8a; font-weight:bold; background:#e2e8f0;">
        📄 PDF हेर्नुहोस् (माउस लगाउनुहोस्)
        <div class="dropdown" id="viewPdfMenu" style="top:100%; left:0;"></div>
      </div>
    </div>
  </div>

  <!-- खोज्ने भाग -->
  <div class="card">
    <h2>🔍 खोज्नुहोस् (Search)</h2>
    <div class="grid2">
      
      <!-- बायाँ: निश्चित PDF भित्र खोज्ने -->
      <div class="search-box">
        <h3>📄 निश्चित PDF भित्र खोज</h3>
        
        <select id="searchFolderSelect" onchange="updatePdfSelect()">
          <option value="">— पहिले फोल्डर छान्नुहोस् —</option>
        </select>
        
        <select id="searchPdfSelect" onchange="toggleViewBtn()">
          <option value="">— PDF छान्नुहोस् —</option>
        </select>

        <button id="viewSelectedPdfBtn" style="width:100%; background:#059669; margin-bottom:10px; display:none;" onclick="viewSelectedPdf()">📖 यो PDF पढ्नुहोस्</button>
        
        <div id="pdfSearchInputs">
          <div class="search-input-row">
            <input type="text" class="pdf-query" placeholder="खोज्नको लागि शब्द लेख्नुहोस् (जस्तै: दफा 10)...">
            <button class="plus-btn" onclick="addSearchInput('pdfSearchInputs', 'pdf-query')" title="अर्को थप्नुहोस्">+</button>
          </div>
        </div>
        <button onclick="doSearch('specific')" style="width:100%; margin-top:10px;">PDF भित्र खोज्नुहोस्</button>
      </div>

      <!-- दायाँ: फोल्डर भित्र खोज्ने -->
      <div class="search-box">
        <h3>📁 फोल्डर / शीर्षक भित्र खोज</h3>
        <div class="multi-select-box" id="folderCheckboxes"></div>
        <div id="folderSearchInputs">
          <div class="search-input-row">
            <input type="text" class="folder-query" placeholder="खोज्नको लागि शब्द लेख्नुहोस्...">
            <button class="plus-btn" onclick="addSearchInput('folderSearchInputs', 'folder-query')" title="अर्को थप्नुहोस्">+</button>
          </div>
        </div>
        <button onclick="doSearch('folder')" style="width:100%; margin-top:10px;">छानिएका फोल्डरमा खोज्नुहोस्</button>
      </div>

    </div>
  </div>

  <div class="card">
    <h2>💬 PDF सँग प्रश्न सोध्नुहोस्</h2>
    <div class="row">
      <input type="text" id="chatQuery" placeholder="तपाईंको प्रश्न..." style="flex:1;min-width:220px; margin-bottom:0;">
      <button id="chatBtn">पठाउनुहोस्</button>
    </div>
  </div>

  <div class="card">
    <h2>📋 नतिजा</h2>
    <div id="answerWrap"></div>
    <div id="resultsWrap"><div class="empty">अझै कुनै खोज गरिएको छैन।</div></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const GITHUB_REPO = "barshapbp2026/any-pdf-";
const GITHUB_BRANCH = "main";

function cleanName(name) {
  return name.replace(/\.pdf$/i, '');
}

// Mozilla PDF.js को लिंक (Chrome मा सिधै खोल्न)
function getPdfViewerUrl(filepath) {
  const encodedPath = filepath.split('/').map(encodeURIComponent).join('/');
  const rawUrl = `https://raw.githubusercontent.com/${GITHUB_REPO}/${GITHUB_BRANCH}/pdfs/${encodedPath}`;
  return `https://mozilla.github.io/pdf.js/web/viewer.html?file=${encodeURIComponent(rawUrl)}`;
}

function buildTree(paths) {
  const tree = {};
  paths.forEach(path => {
    const parts = path.split('/');
    let current = tree;
    for (let i = 0; i < parts.length - 1; i++) {
      const part = parts[i];
      if (!current[part]) current[part] = {};
      current = current[part];
    }
    const file = parts[parts.length - 1];
    current[file] = { _isFile: true, _path: path };
  });
  return tree;
}

// Hover मेनु रेन्डर
function renderTree(tree, isMainNav = false, level = 0) {
  let html = '';
  let keys = Object.keys(tree).filter(k => k !== '_isFile' && k !== '_path');
  keys.sort((a, b) => a.localeCompare(b, 'ne', { numeric: true }));

  keys.forEach(key => {
    const node = tree[key];
    const hasChildren = Object.keys(node).filter(k => k !== '_isFile').length > 0;
    const isFile = node._isFile;
    const displayName = cleanName(key);

    if (level === 0 && isMainNav) {
      html += `<div class="nav-item">${esc(displayName)}`;
      if (hasChildren) html += `<div class="dropdown">${renderTree(node, false, level + 1)}</div>`;
      html += `</div>`;
    } else {
      if (hasChildren) {
        html += `<div class="dropdown-item">${esc(displayName)} <span class="arrow">▶</span>`;
        html += `<div class="sub-dropdown">${renderTree(node, false, level + 1)}</div>`;
        html += `</div>`;
      } else if (isFile) {
        // Mozilla PDF.js को लिंक प्रयोग गरियो (Chrome मा खुल्ने)
        html += `<a href="${getPdfViewerUrl(node._path)}" target="_blank" class="dropdown-item">📄 ${esc(displayName)}</a>`;
      }
    }
  });
  return html;
}

let allFiles = [];
let allFolders = [];

async function loadPdfs() {
  const r = await fetch('/list_pdfs');
  allFiles = await r.json();
  
  if (!allFiles.length) {
    $('#navMenu').innerHTML = '<div class="empty" style="padding:10px;">कुनै PDF भेटिएन।</div>';
    return;
  }
  
  const tree = buildTree(allFiles);
  $('#navMenu').innerHTML = renderTree(tree, true, 0);
  $('#viewPdfMenu').innerHTML = renderTree(tree, false, 0);

  let folderSet = new Set();
  allFiles.forEach(f => {
    let parts = f.split('/');
    if (parts.length > 1) {
      folderSet.add(parts[0]); 
      if (parts.length > 2) folderSet.add(parts[0] + '/' + parts[1]); 
    }
  });
  
  allFolders = Array.from(folderSet).sort((a, b) => a.localeCompare(b, 'ne', { numeric: true }));
  
  let folderSelectHtml = '<option value="">— पहिले फोल्डर छान्नुहोस् —</option>';
  allFolders.forEach(f => {
    folderSelectHtml += `<option value="${esc(f)}">📁 ${esc(f)}</option>`;
  });
  $('#searchFolderSelect').innerHTML = folderSelectHtml;

  let checkboxHtml = `
    <label class="select-all-row">
      <input type="checkbox" id="selectAllFolders" onchange="toggleAllFolders(this)"> 
      ☑️ सबै छान्नुहोस् (Select All)
    </label>
  `;
  allFolders.forEach(f => {
    checkboxHtml += `<label><input type="checkbox" class="folder-checkbox" value="${esc(f)}"> 📁 ${esc(f)}</label>`;
  });
  $('#folderCheckboxes').innerHTML = checkboxHtml;
}

function updatePdfSelect() {
  const selectedFolder = $('#searchFolderSelect').value;
  const pdfSelect = $('#searchPdfSelect');
  
  if (!selectedFolder) {
    pdfSelect.innerHTML = '<option value="">— PDF छान्नुहोस् —</option>';
    toggleViewBtn();
    return;
  }
  
  const filesInFolder = allFiles.filter(f => f.startsWith(selectedFolder + '/'));
  let html = '<option value="">— PDF छान्नुहोस् —</option>';
  filesInFolder.forEach(f => {
    html += `<option value="${esc(f)}">📄 ${esc(cleanName(f))}</option>`;
  });
  pdfSelect.innerHTML = html;
  toggleViewBtn();
}

function toggleViewBtn() {
  const val = $('#searchPdfSelect').value;
  if (val) {
    $('#viewSelectedPdfBtn').style.display = 'block';
  } else {
    $('#viewSelectedPdfBtn').style.display = 'none';
  }
}

// PDF पढ्ने बटनले पनि Mozilla लिंक नै खोल्ने
function viewSelectedPdf() {
  const val = $('#searchPdfSelect').value;
  if (val) {
    window.open(getPdfViewerUrl(val), '_blank');
  }
}

function toggleAllFolders(source) {
  const checkboxes = document.querySelectorAll('.folder-checkbox');
  checkboxes.forEach(cb => cb.checked = source.checked);
}

function addSearchInput(containerId, inputClass) {
  const container = $('#' + containerId);
  if (container.children.length >= 6) return alert('अधिकतम ६ वटा मात्र थप्न सकिन्छ।');
  
  const div = document.createElement('div');
  div.className = 'search-input-row';
  div.innerHTML = `
    <input type="text" class="${inputClass}" placeholder="अर्को शब्द...">
    <button class="remove-btn" onclick="this.parentElement.remove()">✖</button>
  `;
  container.appendChild(div);
}

async function doSearch(type) {
  let queries = [];
  let mode = "";
  let target = "";
  let targets = [];
  
  if (type === 'specific') {
    queries = Array.from(document.querySelectorAll('.pdf-query')).map(i => i.value.trim()).filter(v => v);
    mode = 'specific';
    target = $('#searchPdfSelect').value;
    if (!target) return alert('कृपया सूचीबाट एउटा PDF छान्नुहोस्');
  } else {
    queries = Array.from(document.querySelectorAll('.folder-query')).map(i => i.value.trim()).filter(v => v);
    targets = Array.from(document.querySelectorAll('.folder-checkbox:checked')).map(cb => cb.value);
    if (targets.length === 0) {
      mode = 'all';
    } else {
      mode = 'folder';
    }
  }
  
  if (!queries.length) return alert('खोज्नको लागि कम्तिमा एउटा शब्द लेख्नुहोस् (जस्तै: दफा १०)');
  
  $('#resultsWrap').innerHTML = '<div class="empty">खोजिँदै...</div>';
  const r = await fetch('/search', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ queries, mode, target, targets })
  });
  const d = await r.json();
  if (d.error) return alert(d.error);
  renderResults(d.results, queries.join(' + '));
}

function renderResults(results, query) {
  const wrap = $('#resultsWrap');
  if (!results || !results.length) {
    wrap.innerHTML = `<div class="empty">"${esc(query)}" का लागि कुनै नतिजा भेटिएन।</div>`;
    return;
  }
  let html = '';
  results.forEach(g => {
    html += `<div class="pdf-group"><h4>📄 ${esc(g.filename)}</h4>`;
    g.matches.forEach(m => {
      const sec = m.section ? `<span class="badge">${esc(m.section)}</span>` : `<span class="badge">सन्दर्भ अज्ञात</span>`;
      const url = getPdfViewerUrl(g.filename); 
      html += `
        <div class="result-item">
          <div class="meta">${sec} पृष्ठ <strong>${m.page}</strong>
            <a href="${url}" target="_blank" style="margin-left:auto"><button class="small">पृष्ठ देखाउनुहोस् →</button></a>
          </div>
          <div class="snippet">${esc(m.snippet)}</div>
        </div>`;
    });
    html += '</div>';
  });
  wrap.innerHTML = html;
}

$('#chatBtn').onclick = async () => {
  const query = $('#chatQuery').value.trim();
  if (!query) return alert('प्रश्न लेख्नुहोस्');
  const api_key = $('#apiKey').value.trim();
  $('#answerWrap').innerHTML = '<div class="answer">प्रश्न प्रशोधन हुँदैछ...</div>';
  const r = await fetch('/chat', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ queries: [query], api_key })
  });
  const d = await r.json();
  $('#answerWrap').innerHTML = `<div class="answer">${esc(d.answer)}</div>`;
  renderResults(d.results, query);
};

loadPdfs();
</script>
</body>
</html>
